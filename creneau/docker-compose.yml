services:
  creneau:
    build: .
    ports:
      - '3000:3000'
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Définis SESSION_SECRET dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définis ADMIN_PASSWORD dans .env}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_SENDER: ${SMS_SENDER:-Creneau}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      OVH_APP_KEY: ${OVH_APP_KEY:-}
      OVH_APP_SECRET: ${OVH_APP_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      OVH_SERVICE_NAME: ${OVH_SERVICE_NAME:-}
      HEALTH_ALERT_EMAIL: ${HEALTH_ALERT_EMAIL:-}
      HEALTH_ALERT_PHONE: ${HEALTH_ALERT_PHONE:-}
    volumes:
      - creneau-data:/data
    restart: unless-stopped

volumes:
  creneau-data:
